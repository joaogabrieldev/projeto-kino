name: CI Pipeline

on:
  push:
    branches: [main, entrega-intermediaria]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Instalar dependências
        run: pnpm install --ignore-workspace

      - name: Rodar ESLint
        run: npx eslint . --max-warnings=9999 || true
        working-directory: .

      - name: Rodar Testes de Integração
        run: npx vitest run
